# Builds the ui and server Docker images. On main they're pushed to GitHub
# Container Registry (ghcr.io/gsherper/rt-retail-app-ui and -server);
# pull requests only check that they build.
name: Docker build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Lets the built-in GITHUB_TOKEN push packages to this repo's registry
    permissions:
      contents: read
      packages: write
    strategy:
      # Build both even if one fails, so each result shows up
      fail-fast: false
      matrix:
        image: [ui, server]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          # Push from main (and manual runs) only; pull requests just check the build
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/gsherper/rt-retail-app-${{ matrix.image }}:latest
            ghcr.io/gsherper/rt-retail-app-${{ matrix.image }}:${{ github.sha }}
          # Reuse layers from earlier runs (e.g. installed packages)
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
