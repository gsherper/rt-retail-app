# Published images (from .github/workflows/docker.yml):
#   docker compose pull && docker compose up    uses ghcr.io's latest images
#   docker compose up --build                   builds from this folder's source
services:
  server:
    image: ghcr.io/gsherper/rt-retail-app-server:latest
    build: ./server
    environment:
      # Turns on Swagger (/swagger) and SignalR's detailed errors, for debugging
      # Left on Dev so review can explore and experiment with the demo
      ASPNETCORE_ENVIRONMENT: Development
    # Listens on port 5001 (set in server/Dockerfile). The ui container proxies
    # /hub to it; publishing it also lets you open http://localhost:5001/swagger
    ports:
      - '5001:5001'

  ui:
    image: ghcr.io/gsherper/rt-retail-app-ui:latest
    build: ./ui
    # Open http://localhost:5000
    ports:
      - '5000:5000'
    environment:
      # Where nginx proxies /hub; change it if the server listens elsewhere
      HUB_UPSTREAM: http://server:5001
    depends_on:
      - server
